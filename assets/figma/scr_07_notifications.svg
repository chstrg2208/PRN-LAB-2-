<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" width="360" height="800" style="background:#FFFFFF; font-family:'Inter', sans-serif;">
  <rect width="360" height="800" fill="#FFFFFF"/>
  <!-- Top App Bar -->
  <rect width="360" height="64" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="20" y="40" fill="#111827" font-size="18">←</text>
  <text x="56" y="40" fill="#111827" font-size="15" font-weight="700">Đặt lịch &amp; Session Pass</text>

  <!-- Calendar Selection -->
  <g transform="translate(16, 80)">
    <text x="0" y="20" fill="#111827" font-size="16" font-weight="700">Chọn ngày &amp; khung giờ</text>
    
    <!-- Week strip -->
    <rect y="35" width="60" height="65" rx="8" fill="#1B365D"/>
    <text x="30" y="58" fill="#93C5FD" font-size="11" text-anchor="middle">T7</text>
    <text x="30" y="82" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">24</text>

    <rect x="68" y="35" width="60" height="65" rx="8" fill="#F8F9FA" stroke="#E5E7EB"/>
    <text x="98" y="58" fill="#6B7280" font-size="11" text-anchor="middle">CN</text>
    <text x="98" y="82" fill="#111827" font-size="16" font-weight="700" text-anchor="middle">25</text>

    <rect x="136" y="35" width="60" height="65" rx="8" fill="#F8F9FA" stroke="#E5E7EB"/>
    <text x="166" y="58" fill="#6B7280" font-size="11" text-anchor="middle">T2</text>
    <text x="166" y="82" fill="#111827" font-size="16" font-weight="700" text-anchor="middle">26</text>

    <!-- Slots -->
    <text x="0" y="130" fill="#111827" font-size="14" font-weight="700">Khung giờ sẵn sàng</text>
    <rect y="145" width="155" height="42" rx="8" fill="#FFF3EB" stroke="#F27024"/>
    <text x="77" y="171" fill="#C2410C" font-size="12" font-weight="600" text-anchor="middle">09:00 - 10:00 (Chọn)</text>

    <rect x="170" y="145" width="155" height="42" rx="8" fill="#F8F9FA" stroke="#E5E7EB"/>
    <text x="247" y="171" fill="#4B5563" font-size="12" text-anchor="middle">14:00 - 15:00</text>
  </g>

  <!-- Session Pass Preview Box -->
  <g transform="translate(16, 300)">
    <rect width="328" height="150" rx="12" fill="#F0FDF4" stroke="#10B981"/>
    <rect width="328" height="4" rx="2 2 0 0" fill="#10B981"/>
    <text x="16" y="32" fill="#047857" font-size="14" font-weight="700">SESSION PASS MENTORING</text>
    <text x="16" y="54" fill="#065F46" font-size="12">Mã vé: FPT-MT-2026-9812</text>
    <text x="16" y="74" fill="#065F46" font-size="12">Mentor: Nguyễn Văn Tuấn (K12)</text>
    <text x="16" y="94" fill="#065F46" font-size="12">Hình thức: Online Google Meet</text>
    <text x="16" y="125" fill="#10B981" font-size="12" font-weight="700">✓ Đã xác nhận &amp; đồng bộ Google Calendar</text>
  </g>

  <!-- Sticky CTA -->
  <g transform="translate(0, 720)">
    <rect width="360" height="80" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="20" y="14" width="320" height="48" rx="8" fill="#F27024"/>
    <text x="180" y="44" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">Xác nhận Đặt lịch Mentor</text>
  </g>
</svg>