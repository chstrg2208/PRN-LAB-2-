<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" width="360" height="800">
    <rect width="360" height="800" fill="#F8F9FA"/>
    <!-- App Bar -->
    <rect width="360" height="64" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="20" y="42" fill="#1A1A1A" font-family="Arial" font-size="18" font-weight="bold">← Xác nhận Đăng ký Vé</text>
    
    <!-- Mini Card -->
    <rect x="16" y="80" width="328" height="60" rx="8" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="28" y="105" fill="#1A1A1A" font-family="Arial" font-size="14" font-weight="bold">GenAI with Flutter &amp; Dart</text>
    <text x="28" y="125" fill="#595959" font-family="Arial" font-size="12">15/10/2026 • 13:30 • Hội trường Alpha</text>

    <!-- Inputs -->
    <text x="16" y="165" fill="#1A1A1A" font-family="Arial" font-size="14" font-weight="bold">Họ và tên sinh viên</text>
    <rect x="16" y="175" width="328" height="46" rx="8" fill="#EEEEEE"/>
    <text x="30" y="203" fill="#555555" font-family="Arial" font-size="14">Nguyễn Minh Tú (Tự động)</text>

    <text x="16" y="245" fill="#1A1A1A" font-family="Arial" font-size="14" font-weight="bold">Mã số sinh viên (MSSV)</text>
    <rect x="16" y="255" width="328" height="46" rx="8" fill="#EEEEEE"/>
    <text x="30" y="283" fill="#555555" font-family="Arial" font-size="14">SE193059 (Đã xác thực FPT Edu)</text>

    <text x="16" y="325" fill="#1A1A1A" font-family="Arial" font-size="14" font-weight="bold">Hình thức tham gia</text>
    <circle cx="30" cy="355" r="8" fill="#F27024"/>
    <text x="48" y="360" fill="#1A1A1A" font-family="Arial" font-size="14">Tham gia Trực tiếp tại Hội trường (Offline)</text>
    <circle cx="30" cy="385" r="8" stroke="#8C8C8C" fill="none"/>
    <text x="48" y="390" fill="#595959" font-family="Arial" font-size="14">Xem Livestream qua Google Meet (Online)</text>

    <text x="16" y="430" fill="#1A1A1A" font-family="Arial" font-size="14" font-weight="bold">Câu hỏi cho diễn giả (không bắt buộc)</text>
    <rect x="16" y="440" width="328" height="70" rx="8" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="28" y="470" fill="#8C8C8C" font-family="Arial" font-size="13">Nhập nội dung thắc mắc của bạn...</text>

    <rect x="16" y="530" width="20" height="20" rx="4" fill="#F27024"/>
    <text x="21" y="545" fill="#FFFFFF" font-family="Arial" font-size="14">✓</text>
    <text x="46" y="545" fill="#1A1A1A" font-family="Arial" font-size="13">Tôi cam kết tham gia đúng giờ để nhận điểm PDP</text>

    <!-- Submit CTA -->
    <rect x="16" y="710" width="328" height="50" rx="12" fill="#F27024"/>
    <text x="95" y="741" fill="#FFFFFF" font-family="Arial" font-size="15" font-weight="bold">XÁC NHẬN ĐĂNG KÝ VÉ</text>
  </svg>