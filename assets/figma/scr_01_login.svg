<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" width="360" height="800" style="background:#FFFFFF; font-family:'Inter', sans-serif;">
  <rect width="360" height="800" fill="#FFFFFF"/>
  <!-- Header Pattern -->
  <rect width="360" height="260" fill="#1B365D"/>
  <circle cx="300" cy="60" r="80" fill="#F27024" opacity="0.2"/>
  <circle cx="60" cy="220" r="50" fill="#10B981" opacity="0.15"/>
  
  <rect x="150" y="70" width="60" height="60" rx="14" fill="#F27024"/>
  <text x="180" y="108" fill="#FFFFFF" font-size="22" font-weight="bold" text-anchor="middle">FA</text>
  <text x="180" y="160" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle">F-Alumni Network</text>
  <text x="180" y="184" fill="#93C5FD" font-size="13" text-anchor="middle">FPT University Career &amp; Mentorship</text>

  <!-- Login Card -->
  <g transform="translate(24, 230)">
    <rect width="312" height="360" rx="16" fill="#FFFFFF" stroke="#E5E7EB" filter="drop-shadow(0 4px 12px rgba(27,54,93,0.08))"/>
    <text x="24" y="44" fill="#111827" font-size="17" font-weight="700">Đăng nhập tài khoản</text>
    <text x="24" y="66" fill="#6B7280" font-size="12">Dành cho sinh viên &amp; cựu sinh viên FPT</text>

    <!-- Campus Picker -->
    <text x="24" y="110" fill="#374151" font-size="12" font-weight="600">Chọn Campus</text>
    <rect x="24" y="120" width="264" height="46" rx="8" fill="#F8F9FA" stroke="#CBD5E1"/>
    <text x="40" y="148" fill="#111827" font-size="13">TP. Hồ Chí Minh (Q9)</text>
    <text x="264" y="148" fill="#6B7280" font-size="12">▼</text>

    <!-- Google Button -->
    <rect x="24" y="190" width="264" height="48" rx="8" fill="#FFFFFF" stroke="#1B365D" stroke-width="1.5"/>
    <circle cx="48" cy="214" r="10" fill="#EA4335"/>
    <text x="48" y="218" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">G</text>
    <text x="160" y="219" fill="#1B365D" font-size="13" font-weight="600" text-anchor="middle">Đăng nhập với Google FPT</text>

    <!-- SSO Note -->
    <rect x="24" y="260" width="264" height="60" rx="8" fill="#EFF6FF"/>
    <text x="36" y="284" fill="#1E40AF" font-size="11" font-weight="600">🔒 Xác thực bảo mật SSO @fpt.edu.vn</text>
    <text x="36" y="302" fill="#3B82F6" font-size="11">Tự động nhận diện hồ sơ Cựu sinh viên / Sinh viên</text>
  </g>

  <text x="180" y="740" fill="#9CA3AF" font-size="11" text-anchor="middle">PRM323 Lab 2 • SCR_01 Login Screen</text>
</svg>